<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eletromax V2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><h1>⚡ Eletromax V2</h1><p>Painel de ofertas e automação</p></div><span class="status">MVP Online</span></header>
<main>
<section class="cards">
<div class="card"><b id="total">0</b><span>Ofertas</span></div>
<div class="card"><b id="ml">0</b><span>Mercado Livre</span></div>
<div class="card"><b id="shopee">0</b><span>Shopee</span></div>
<div class="card"><b id="published">0</b><span>Publicadas</span></div>
</section>
<section class="panel">
<h2>Adicionar oferta</h2>
<form id="offerForm">
<input id="title" placeholder="Nome do produto" required>
<input id="url" placeholder="Link do produto" required>
<input id="price" type="number" step="0.01" placeholder="Preço">
<select id="source"><option>Mercado Livre</option><option>Shopee</option></select>
<button>Adicionar</button>
</form>
</section>
<section class="panel">
<h2>Ofertas cadastradas</h2>
<div id="offers"></div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
